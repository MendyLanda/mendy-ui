name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mendy-ui-${{ github.ref != 'refs/heads/main' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  commits:
    name: Conventional commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the squash commit title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm lint:commits
      - name: Validate new main commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: pnpm lint:commits --from "$BEFORE" --to "$AFTER"
      - name: Validate a manually checked commit
        if: github.event_name == 'workflow_dispatch'
        run: pnpm lint:commits --last

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format && pnpm build && pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit
      - run: pnpm package:pack
      - uses: actions/upload-artifact@v4
        with:
          name: checked-build
          path: |
            out/
            packages/ui/dist/
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: mendy-ui-package
          path: artifacts/*.tgz

  browser:
    name: Browser (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: desktop
            browser: chromium
          - project: mobile
            browser: chromium
          - project: firefox
            browser: firefox
          - project: webkit
            browser: webkit
          - project: webkit-mobile
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: checked-build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Browser interaction and accessibility
        run: pnpm test --project=${{ matrix.project }} --workers=2
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-${{ matrix.project }}
          path: playwright-report/
          if-no-files-found: ignore

  stress:
    name: Stress (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: checked-build
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Large-collection stress checks
        run: node tests/stress/run.mjs
        env:
          STRESS_BROWSERS: ${{ matrix.browser }}
          STRESS_OUTPUT: artifacts/stress
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: stress-${{ matrix.browser }}
          path: artifacts/stress/
          if-no-files-found: ignore

  consumers:
    name: Fresh package consumers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: checked-build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:consumers

  check:
    name: check
    permissions:
      contents: read
      statuses: write
    if: always()
    needs: [commits, build, browser, stress, consumers]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - name: Report release PR checks
        if: >-
          always() && github.event_name == 'workflow_dispatch' &&
          startsWith(github.ref, 'refs/heads/release-please--')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RESULTS: ${{ toJSON(needs) }}
        with:
          script: |
            const passed = Object.values(JSON.parse(process.env.RESULTS)).every(job => job.result === 'success');
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: context.sha, state: passed ? 'success' : 'failure',
              context: 'Release checks',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: passed ? 'All release checks passed' : 'Release checks need attention',
            });

  deploy:
    name: Deploy
    concurrency:
      group: mendy-ui-docs-deploy
      queue: max
    needs: [check, build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: checked-build
      - name: Check whether this is still the newest main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          echo "deploy=$([ "$tip" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - run: pnpm exec wrangler deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
