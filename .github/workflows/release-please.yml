name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: release-please
  queue: max
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
      # Bot-created PR runs require approval. Explicitly dispatch CI on the
      # release branch instead; no extra GitHub token is needed.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: steps.release.outputs.pr != ''
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        with:
          script: |
            const pr = JSON.parse(process.env.RELEASE_PR);
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: pr.headBranchName });
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: branch.commit.sha, state: 'pending', context: 'Release checks',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/ci.yml`,
              description: 'Checking the proposed release',
            });
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci.yml', ref: pr.headBranchName,
            });
