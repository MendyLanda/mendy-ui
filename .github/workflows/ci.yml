name: Check and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mendy-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm format && pnpm build && pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Unit tests
        run: pnpm test:unit
      - name: Browser interaction and accessibility
        run: pnpm test
      - name: Large-collection stress checks
        run: STRESS_BROWSERS=chromium,firefox,webkit pnpm test:stress
      - name: Fresh package consumers
        run: pnpm verify:consumers
      - run: pnpm package:pack
      - uses: actions/upload-artifact@v4
        with:
          name: mendy-ui-package
          path: artifacts/*.tgz
      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
