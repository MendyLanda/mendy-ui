name: Prepare release
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Check and deploy]
    types: [requested, completed]
    branches: ["release-please--*"]
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: release-please
  queue: max
jobs:
  release:
    if: github.event_name != 'workflow_run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
      # Bot-created PR runs require approval. Explicitly dispatch CI on the
      # release branch instead; no extra GitHub token is needed.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        if: steps.release.outputs.pr != ''
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        with:
          script: |
            const pr = JSON.parse(process.env.RELEASE_PR);
            await github.rest.actions.createWorkflowDispatch({
              ...context.repo, workflow_id: 'ci.yml', ref: pr.headBranchName,
            });

  report-checks:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      github.event.workflow_run.path == '.github/workflows/ci.yml' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Dispatched check suites are not attached to the PR by GitHub. Expose
      # their result on the same commit so the PR has a visible CI status.
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data: prs } = await github.rest.pulls.list({
              ...context.repo, state: 'open', base: 'main',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            if (!prs.some(pr => pr.head.sha === run.head_sha && pr.user.login === 'github-actions[bot]')) return;
            const state = context.payload.action === 'requested' ? 'pending'
              : run.conclusion === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: run.head_sha, state,
              context: 'Release checks', target_url: run.html_url,
              description: state === 'pending' ? 'Checking the proposed release'
                : state === 'success' ? 'All release checks passed' : 'Release checks need attention',
            });
